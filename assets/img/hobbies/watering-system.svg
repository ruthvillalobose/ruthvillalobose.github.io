<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Illustration of an automatic watering system with a water tank, pump and tube">
  <rect width="400" height="300" fill="#e7f2fb"/>
  <!-- tank -->
  <rect x="40" y="90" width="100" height="160" rx="10" fill="#ffffff" stroke="#b9d4ea" stroke-width="4"/>
  <rect x="44" y="150" width="92" height="96" rx="7" fill="#4aa8ff" opacity=".75"/>
  <path d="M44 150 q23 -8 46 0 t46 0" fill="#7cc0ff"/>
  <g fill="#fff" opacity=".7"><circle cx="70" cy="200" r="4"/><circle cx="100" cy="220" r="3"/><circle cx="85" cy="180" r="2.5"/></g>
  <!-- pump -->
  <rect x="150" y="215" width="44" height="34" rx="6" fill="#5b4bdb"/>
  <circle cx="172" cy="232" r="8" fill="#eeebff"/>
  <path d="M136 235 h14" stroke="#8a8fa3" stroke-width="6"/>
  <!-- tube -->
  <path d="M172 215 V80 q0 -20 20 -20 h90 q20 0 20 20 v40" stroke="#8a8fa3" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- droplets -->
  <g fill="#4aa8ff"><path d="M302 132 q-6 10 0 14 q6 -4 0 -14z"/><path d="M294 152 q-5 8 0 11 q5 -3 0 -11z"/><path d="M310 156 q-5 8 0 11 q5 -3 0 -11z"/></g>
  <!-- plant + pot -->
  <path d="M302 200 v-26" stroke="#2f8556" stroke-width="3"/>
  <path d="M302 186 q-26 -2 -32 -24 q26 0 32 24z" fill="#3c9a64"/>
  <path d="M302 180 q26 -4 30 -28 q-26 4 -30 28z" fill="#57b37c"/>
  <path d="M262 205 h80 l-10 50 h-60z" fill="#d9774b"/><rect x="258" y="198" width="88" height="12" rx="3" fill="#c4623a"/>
  <rect x="20" y="250" width="360" height="8" rx="3" fill="#b9d4ea"/>
</svg>
