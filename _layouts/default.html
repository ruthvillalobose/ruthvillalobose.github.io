<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}Ruth Villalobos · Data Scientist & AI Engineer</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a href="{{ '/' | relative_url }}" class="logo">RV<span>.</span></a>
      <nav>
        <a href="{{ '/' | relative_url }}" {% if page.nav == 'home' %}class="active" aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/projects/' | relative_url }}" {% if page.nav == 'projects' %}class="active" aria-current="page"{% endif %}>Projects</a>
        <a href="{{ '/notes/' | relative_url }}" {% if page.nav == 'notes' %}class="active" aria-current="page"{% endif %}>Notes</a>
      </nav>
    </div>
  </header>

{{ content }}

  <footer class="wrap footer">
    <p>© {{ site.time | date: '%Y' }} Ruth Villalobos · Built with GitHub Pages</p>
  </footer>
</body>
</html>
