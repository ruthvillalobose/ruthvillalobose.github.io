---
layout: default
nav: notes
---
  <main class="wrap page">
    <a class="back" href="{{ '/notes/' | relative_url }}">← All notes</a>
    <article class="note">
      <header class="note-head">
        <p class="eyebrow">{{ page.date | date: '%B %-d, %Y' }}</p>
        <h1>{{ page.title }}</h1>
        {% if page.tags.size > 0 %}
        <ul class="tags small">{% for t in page.tags %}<li>{{ t }}</li>{% endfor %}</ul>
        {% endif %}
      </header>
      <div class="prose">
{{ content }}
      </div>
    </article>
  </main>
